name: Flutter / Android Build (Normal)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project (release asset)"
        required: true
        type: string
      tag:
        description: "Release tag yang dipakai"
        required: true
        type: string
      build_type:
        description: "debug atau release"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Bersihkan ruang disk
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk sebelum:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "Disk sesudah:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/cmdline-tools/bin:$PATH"

          # Cari sdkmanager
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan di ANDROID_HOME=$ANDROID_HOME"
            ls -la "$ANDROID_HOME" 2>/dev/null || true
            find "$ANDROID_HOME" -maxdepth 4 -type d 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"

          # Accept licenses (abaikan noise)
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/tmp/sdk-licenses.log 2>&1 || true

          # Install paket yang dibutuhkan (JANGAN install package "tools" — sudah obsolete)
          # Jangan pipe ke /dev/null supaya error nyata terlihat
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            2>&1 | tee /tmp/sdk-install.log

          # Pastikan setidaknya salah satu build-tools ada
          if ! ls -d "$ANDROID_HOME"/build-tools/* >/dev/null 2>&1; then
            echo "::error::build-tools gagal terinstall"
            cat /tmp/sdk-install.log || true
            exit 1
          fi

          echo "Android packages siap."
          ls -la "$ANDROID_HOME"/build-tools/ || true
          ls -la "$ANDROID_HOME"/platforms/ || true

      - name: Download project ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo "Download dari: ${{ inputs.zip_url }}"
          curl -L --fail --retry 3 -o project.zip "${{ inputs.zip_url }}"
          ls -lh project.zip
          unzip -q project.zip -d project

          if [ -f project/pubspec.yaml ] || [ -f project/android/app/build.gradle ] || [ -f project/android/app/build.gradle.kts ]; then
            echo "PROJECT_DIR=project" >> $GITHUB_ENV
          else
            SUB=$(find project -maxdepth 4 \( -name pubspec.yaml -o -name build.gradle -o -name build.gradle.kts \) | head -1 | xargs dirname)
            if [ -z "$SUB" ]; then
              echo "::error::Tidak menemukan pubspec.yaml / build.gradle di dalam ZIP"
              find project -maxdepth 4 -type f | head -50 || true
              exit 1
            fi
            # Kalau ketemu android/app/build.gradle, naik ke root project
            if echo "$SUB" | grep -q '/android/app$'; then
              SUB=$(dirname "$(dirname "$SUB")")
            elif echo "$SUB" | grep -q '/android$'; then
              SUB=$(dirname "$SUB")
            fi
            echo "PROJECT_DIR=$SUB" >> $GITHUB_ENV
          fi
          echo "Project dir: ${PROJECT_DIR:-project}"
          ls -la "${PROJECT_DIR:-project}" | head -30

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          if [ -f pubspec.yaml ]; then
            echo "type=flutter" >> $GITHUB_OUTPUT
            echo "Flutter project terdeteksi"
          elif [ -f android/app/build.gradle ] || [ -f android/app/build.gradle.kts ] || [ -f app/build.gradle ] || [ -f app/build.gradle.kts ] || [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "type=android" >> $GITHUB_OUTPUT
            echo "Android/Gradle project terdeteksi"
          else
            echo "::error::Tipe project tidak dikenali"
            find . -maxdepth 3 -type f | head -40
            exit 1
          fi

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get & build
        if: steps.detect.outputs.type == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          flutter --version
          flutter pub get
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
            APK=$(find build/app/outputs -name "*.apk" | head -1)
          else
            flutter build apk --release
            APK=$(find build/app/outputs -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::APK Flutter tidak ditemukan"
            find build -name "*.apk" 2>/dev/null | head -20 || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/app.apk"
          ls -lh "$GITHUB_WORKSPACE/output/app.apk"

      - name: Gradle build (Android native)
        if: steps.detect.outputs.type == 'android'
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          # Tentukan root gradle (bisa di root atau di subfolder android)
          if [ -f gradlew ]; then
            ROOT="."
          elif [ -f android/gradlew ]; then
            ROOT="android"
          else
            echo "::error::gradlew tidak ditemukan"
            find . -name "gradlew" 2>/dev/null | head -10 || true
            exit 1
          fi
          cd "$ROOT"
          chmod +x ./gradlew
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace
            APK=$(find . -path "*/outputs/apk/debug/*.apk" | head -1)
          else
            ./gradlew assembleRelease --stacktrace
            APK=$(find . -path "*/outputs/apk/release/*.apk" | head -1)
          fi
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::APK tidak ditemukan setelah gradle build"
            find . -name "*.apk" 2>/dev/null | head -10 || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/app.apk"
          ls -lh "$GITHUB_WORKSPACE/output/app.apk"

      - name: Sign APK (debug keystore fallback)
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/output/app.apk"
          [ -f "$APK" ] || { echo "::error::app.apk tidak ada"; exit 1; }

          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then
            echo "::error::build-tools tidak ditemukan di $ANDROID_HOME"
            ls -la "$ANDROID_HOME" 2>/dev/null || true
            exit 1
          fi
          echo "Build-tools: $BT"

          KS_FILE=/tmp/debug.keystore
          KS_PASS=android
          KS_ALIAS=androiddebugkey
          KEY_PASS=android

          if [ ! -f "$KS_FILE" ]; then
            keytool -genkeypair -v \
              -keystore "$KS_FILE" \
              -storepass "$KS_PASS" \
              -alias "$KS_ALIAS" \
              -keypass "$KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Debug,OU=Build,O=Bot,L=Jakarta,ST=JK,C=ID" \
              >/tmp/keytool.log 2>&1 || true
          fi

          "$BT/zipalign" -f 4 "$APK" /tmp/aligned.apk
          "$BT/apksigner" sign \
            --ks "$KS_FILE" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$GITHUB_WORKSPACE/output/app-signed.apk" \
            /tmp/aligned.apk
          "$BT/apksigner" verify --verbose "$GITHUB_WORKSPACE/output/app-signed.apk"
          mv "$GITHUB_WORKSPACE/output/app-signed.apk" "$GITHUB_WORKSPACE/output/app.apk"
          ls -lh "$GITHUB_WORKSPACE/output/app.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: output/app.apk
          if-no-files-found: error
          retention-days: 14
